name: CI

on:
  push:
    branches: [main, "feat/*", "feature/*", "build/*"]
  pull_request:
  workflow_dispatch:

env:
  COMPETITOR_RADAR_INTERNAL: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run pytest
        run: uv run --extra test pytest -v
