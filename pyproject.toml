[project]
name = "competitor-radar"
version = "0.1.0"
description = "Local-First Competitive Intelligence Radar: Web Deltas, Pricing Shifts, Sitemap Traversal & ATS Hiring Signals"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Surendran B", email = "reachsuren@gmail.com" }]
keywords = [
  "mcp",
  "competitor-radar",
  "competitive-intelligence",
  "pricing-tracker",
  "sitemap-diff",
  "ats-radar",
  "greenhouse",
  "ashby",
  "web-monitoring",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business",
]
dependencies = [
  "mcp>=2.0.0,<3",
  "requests>=2.31.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
]
publish = [
  "build>=1.2.2",
  "twine>=5.1.1",
]

[project.urls]
Homepage = "https://github.com/surendranb/competitor-radar"
Repository = "https://github.com/surendranb/competitor-radar"
Issues = "https://github.com/surendranb/competitor-radar/issues"

[project.scripts]
competitor-radar = "competitor_radar.cli:main"
competitor-radar-mcp = "competitor_radar.server:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
